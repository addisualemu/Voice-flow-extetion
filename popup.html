<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voice Flow</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
      <h1 style="margin-bottom: 0;">Voice Flow</h1>
      <div style="display: flex; gap: 8px; align-items: center;">
        <a href="https://studio-6322617027-3e57b.web.app/" target="_blank" rel="noopener noreferrer" style="font-size: 12px; color: #4f46e5; text-decoration: none; padding: 4px 8px; border-radius: 4px; transition: background-color 0.2s;" title="Open VoiceFlow Studio">Open VoiceFlow</a>
        <a href="#" id="settingsLink" style="font-size: 12px; color: #6b7280; text-decoration: none; padding: 4px 8px; border-radius: 4px; transition: background-color 0.2s;" title="Open Settings">⚙️ Settings</a>
      </div>
    </div>

    <p id="accountLine" class="account-line">Checking connection…</p>

    <!-- Input area -->
    <div class="input-section">
      <div class="textarea-wrap">
        <textarea id="textInput" placeholder="Type or paste text here…" rows="4"></textarea>
        <button type="button" id="dictateBtn" class="dictate-btn" title="Voice dictate" aria-label="Start voice dictate">
          <span class="mic-icon">🎤</span>
        </button>
      </div>
      <button id="saveBtn" class="btn btn-primary">Save </button>
    </div>

    <!-- Status message -->
    <div id="status" class="status hidden"></div>
  </div>

  <!-- Firebase SDKs (compat builds for simpler usage) -->
  <script src="libs/firebase-app-compat.js"></script>
  <script src="libs/firebase-auth-compat.js"></script>
  <script src="libs/firebase-firestore-compat.js"></script>

  <!-- App scripts -->
  <script src="firebase-config.js"></script>
  <script src="popup.js"></script>
</body>
</html>
