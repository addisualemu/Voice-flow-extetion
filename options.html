<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voice Flow</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <div class="container">
    <h1>Voice Flow</h1>
    <p class="description">
      Enter the connection PIN from Voice Flow Studio. The extension signs in as you and saves tasks to your account.
    </p>

    <div id="connectedPanel" class="hidden">
      <div class="status info">Connected as <strong id="connectedEmail"></strong>.</div>
      <button type="button" id="disconnectBtn" class="btn btn-secondary btn-block">Disconnect</button>
    </div>

    <form id="pinForm">
      <div class="form-group">
        <label for="pin">Connection PIN</label>
        <input type="text" id="pin" name="pin" inputmode="text" autocomplete="off" spellcheck="false" autocapitalize="characters" maxlength="16" placeholder="PIN" required>
        <small>In Voice Flow Studio, open Connection PIN and copy the code.</small>
      </div>

      <div id="status" class="status hidden"></div>

      <div class="button-group">
        <button type="submit" id="connectBtn" class="btn btn-primary">Connect</button>
      </div>
    </form>
  </div>

  <script src="libs/firebase-app-compat.js"></script>
  <script src="libs/firebase-auth-compat.js"></script>
  <script src="libs/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="options.js"></script>
</body>
</html>
