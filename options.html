<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voice Flow</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <div class="container">
    <h1>Voice Flow</h1>
    <p class="description">
      Enter your Firebase API Key. You can find it in the Firebase Console → Project Settings → General → Your apps.
    </p>

    <form id="firebaseForm">
      <div class="form-group">
        <label for="apiKey">Firebase API Key *</label>
        <input type="text" id="apiKey" name="apiKey" placeholder="AIzaSy..." required>
        <small>Find it in Firebase Console → Project Settings → General → Your apps</small>
      </div>

      <div class="form-group">
        <label for="userId">User ID *</label>
        <input type="text" id="userId" name="userId" placeholder="Enter your user ID" required>
        <small>Enter the user ID that matches your Firestore database structure (users/{userId}/tasks/...)</small>
      </div>

      <div id="status" class="status hidden"></div>

      <div class="button-group">
        <button type="submit" id="saveBtn" class="btn btn-primary">Save </button>
        <button type="button" id="testBtn" class="btn btn-secondary">Test </button>
      </div>
    </form>
  </div>

  <script src="options.js"></script>
</body>
</html>
